<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rapoo v2.6</title><link rel="stylesheet" href="style.css"></head><body>
<div class="keyboard-container">
<div class="header"><div class="dots"><span></span><span></span><span></span></div><div class="title">RAPOO • MERGED v2.6 <span class="settings-btn" id="settingsBtn">⚙️</span></div><div class="lang-indicator" id="langIndicator">EN</div></div>
<div class="suggestion-bar" id="suggestionBar"><div class="suggestion" style="opacity:.4">ابدأ الكتابة...</div></div>
<div class="keyboard" id="keyboard"></div>
<div class="footer"><div class="saved"><span>32% SAVED • 86mm</span></div><div class="version"><span style="width:5px;height:5px;background:#10b981;border-radius:50%;display:inline-block;box-shadow:0 0 6px #10b981"></span><span id="versionText">v2.6 STABLE</span></div></div>
<div class="overlay" id="overlay"><div class="overlay-text" style="color:#c4b5fd;text-align:center;padding:20px">TRACKPAD<br><small style="font-size:10px">حرك صباعك</small></div></div>
<div class="mini-toast" id="miniToast"></div>

<div class="settings-panel" id="settingsPanel">
<div class="settings-header"><span class="settings-title">⚙️ إعدادات Rapoo v2.6</span><button class="close-settings" id="closeSettings">✕</button></div>
<div class="settings-content" id="settingsContent">
<div class="setting-group"><span class="setting-label">🌐 اللغة - Language</span><div class="setting-grid" id="langOptions">
<button class="option-btn" data-lang="en">EN English</button><button class="option-btn" data-lang="ar">AR عربي</button><button class="option-btn" data-lang="fr">FR</button><button class="option-btn" data-lang="de">DE</button>
</div></div>
<div class="setting-group"><span class="setting-label">🎨 الثيمات - Themes</span><div class="setting-grid" id="themeOptions">
<button class="option-btn" data-theme="dark">🌙 Dark</button><button class="option-btn" data-theme="light">☀️ Light</button><button class="option-btn" data-theme="amoled">🖤 Amoled</button><button class="option-btn" data-theme="neon">💠 Neon</button><button class="option-btn" data-theme="rgb_wave">🌈 RGB Wave</button><button class="option-btn" data-theme="rapoo_purple">💜 Purple</button>
</div></div>
<div class="setting-group"><span class="setting-label">🔊 صوت ميكانيكي</span><div class="setting-grid" id="soundOptions">
<button class="option-btn" data-sound="off">🔇 Off</button><button class="option-btn" data-sound="clicky">🔵 Clicky</button><button class="option-btn" data-sound="thocky">🟤 Thocky</button><button class="option-btn" data-sound="linear">🔴 Linear</button>
</div></div>
<div class="setting-group"><span class="setting-label">🌈 RGB</span><div class="setting-grid" id="rgbOptions">
<button class="option-btn" data-rgb="off">Off</button><button class="option-btn" data-rgb="reactive">⚡ Reactive</button><button class="option-btn" data-rgb="wave">🌊 Wave</button><button class="option-btn" data-rgb="rainbow">🌈 Rainbow</button>
</div></div>
<div class="setting-group"><span class="setting-label">✍️ تصحيح</span><div class="setting-row">
<button class="option-btn" id="autocorrectToggle">✅ تصحيح تلقائي</button><button class="option-btn" id="suggestToggle">💡 اقتراحات</button>
</div></div>
<div class="setting-group"><span class="setting-label">⚡ تحكم</span><div class="setting-row">
<button class="option-btn" id="vibToggle">📳 اهتزاز</button><button class="option-btn" id="resetBtn">🔄 إعادة ضبط</button>
</div></div>
</div>
</div>
</div>
<script src="app.js"></script>
</body></html>
