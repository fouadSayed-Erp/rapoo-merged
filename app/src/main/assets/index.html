<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rapoo v2 Ultimate</title><link rel="stylesheet" href="style.css"></head><body>
<div class="keyboard-container">
<div class="header"><div class="dots"><span></span><span></span><span></span></div><div class="title">RAPOO • MERGED v2.0 <span class="settings-btn" id="settingsBtn">⚙️</span></div><div class="lang-indicator" id="langIndicator">EN</div></div>
<div class="keyboard" id="keyboard"></div>
<div class="footer"><div class="saved"><div class="bar"></div><span>32% SAVED • 86mm</span></div><div class="version"><span class="green-dot"></span><span id="versionText">ULTIMATE RGB</span></div></div>
<div class="overlay" id="overlay"><div class="overlay-text">TRACKPAD ACTIVE<br><small style="font-size:10px;color:#8b5cf6">حرك صباعك</small></div></div>

<div class="settings-panel" id="settingsPanel">
<div class="settings-header"><span class="settings-title">⚙️ إعدادات Rapoo Ultimate</span><button class="close-settings" id="closeSettings">✕</button></div>

<div class="setting-group"><span class="setting-label">🌐 اللغة - Language</span><div class="setting-options" id="langOptions">
<button class="option-btn" data-lang="en">EN English</button>
<button class="option-btn" data-lang="ar">AR عربي</button>
<button class="option-btn" data-lang="fr">FR Français</button>
<button class="option-btn" data-lang="de">DE Deutsch</button>
</div></div>

<div class="setting-group"><span class="setting-label">🎨 الثيمات - Themes</span><div class="setting-options" id="themeOptions">
<button class="option-btn" data-theme="dark">Dark</button>
<button class="option-btn" data-theme="light">Light</button>
<button class="option-btn" data-theme="amoled">Amoled</button>
<button class="option-btn" data-theme="neon">Neon Cyan</button>
<button class="option-btn" data-theme="rgb_wave">RGB Wave</button>
<button class="option-btn" data-theme="rapoo_purple">Rapoo Purple</button>
</div></div>

<div class="setting-group"><span class="setting-label">🔊 صوت الزراير - Mechanical Sounds</span><div class="setting-options" id="soundOptions">
<button class="option-btn" data-sound="off">🔇 Off</button>
<button class="option-btn" data-sound="clicky">Clicky Blue</button>
<button class="option-btn" data-sound="thocky">Thocky Creamy</button>
<button class="option-btn" data-sound="linear">Linear Red</button>
<button class="option-btn" data-sound="typewriter">Typewriter</button>
</div></div>

<div class="setting-group"><span class="setting-label">🌈 RGB - تفاعل الألوان</span><div class="setting-options" id="rgbOptions">
<button class="option-btn" data-rgb="off">Off</button>
<button class="option-btn" data-rgb="reactive">Reactive - يتفاعل مع الدوسة</button>
<button class="option-btn" data-rgb="wave">Wave - موجة مستمرة</button>
<button class="option-btn" data-rgb="breathing">Breathing - تنفس</button>
<button class="option-btn" data-rgb="rainbow">Rainbow Border</button>
</div></div>

<div class="setting-group"><span class="setting-label">⚡ إضافات</span><div class="setting-options">
<button class="option-btn" id="vibToggle">📳 اهتزاز: مفعل</button>
<button class="option-btn" id="resetBtn">🔄 إعادة ضبط</button>
</div></div>

</div>
</div>
<script src="app.js"></script>
</body></html>
