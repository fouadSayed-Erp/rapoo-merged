name: Build Rapoo Merged APK - Gradle 8.4 Fixed

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK with Gradle 8.4
        run: gradle :app:assembleDebug --no-daemon --stacktrace --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rapoo-Merged-FINAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
