<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rapoo v2.1</title><link rel="stylesheet" href="style.css"></head><body>
<div class="keyboard-container">
<div class="header"><div class="dots"><span></span><span></span><span></span></div><div class="title">RAPOO • MERGED v2.1 <span class="settings-btn" id="settingsBtn">⚙️</span></div><div class="lang-indicator" id="langIndicator">EN</div></div>
<div class="suggestion-bar" id="suggestionBar"><div class="suggestion" style="opacity:0.4">ابدأ الكتابة للتصحيح...</div></div>
<div class="keyboard" id="keyboard"></div>
<div class="footer"><div class="saved"><div class="bar"></div><span>32% SAVED • 86mm</span></div><div class="version"><span class="green-dot"></span><span id="versionText">AUTOCORRECT • RGB</span></div></div>
<div class="overlay" id="overlay"><div class="overlay-text">TRACKPAD<br><small>حرك صباعك</small></div></div>
<div class="mini-toast" id="miniToast"></div>
<div class="settings-panel" id="settingsPanel">
<div class="settings-header"><span class="settings-title">⚙️ إعدادات v2.1</span><button class="close-settings" id="closeSettings">✕</button></div>
<div class="setting-group"><span class="setting-label">🌐 اللغة</span><div class="setting-options" id="langOptions">
<button class="option-btn" data-lang="en">EN English</button><button class="option-btn" data-lang="ar">AR عربي</button><button class="option-btn" data-lang="fr">FR</button><button class="option-btn" data-lang="de">DE</button>
</div></div>
<div class="setting-group"><span class="setting-label">🎨 الثيمات</span><div class="setting-options" id="themeOptions">
<button class="option-btn" data-theme="dark">Dark</button><button class="option-btn" data-theme="light">Light</button><button class="option-btn" data-theme="amoled">Amoled</button><button class="option-btn" data-theme="neon">Neon</button><button class="option-btn" data-theme="rgb_wave">RGB Wave</button><button class="option-btn" data-theme="rapoo_purple">Purple</button>
</div></div>
<div class="setting-group"><span class="setting-label">🔊 صوت ميكانيكي</span><div class="setting-options" id="soundOptions">
<button class="option-btn" data-sound="off">Off</button><button class="option-btn" data-sound="clicky">Clicky</button><button class="option-btn" data-sound="thocky">Thocky</button><button class="option-btn" data-sound="linear">Linear</button><button class="option-btn" data-sound="typewriter">Typewriter</button>
</div></div>
<div class="setting-group"><span class="setting-label">🌈 RGB</span><div class="setting-options" id="rgbOptions">
<button class="option-btn" data-rgb="off">Off</button><button class="option-btn" data-rgb="reactive">Reactive</button><button class="option-btn" data-rgb="wave">Wave</button><button class="option-btn" data-rgb="rainbow">Rainbow</button>
</div></div>
<div class="setting-group"><span class="setting-label">✍️ تصحيح كلمات</span><div class="setting-options">
<button class="option-btn" id="autocorrectToggle">✅ تصحيح تلقائي: مفعل</button><button class="option-btn" id="suggestToggle">💡 اقتراحات: مفعلة</button>
</div></div>
<div class="setting-group"><span class="setting-label">⚡</span><div class="setting-options">
<button class="option-btn" id="vibToggle">📳 اهتزاز</button><button class="option-btn" id="resetBtn">🔄 إعادة ضبط</button>
</div></div>
</div>
</div>
<script src="app.js"></script>
</body></html>
