<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rapoo v3.8 SMALL</title><link rel="stylesheet" href="style.css"></head><body>
<div class="keyboard-container" id="keyboardContainer">
<div class="header" id="headerBar"><div class="dots" id="dotsMenu"><span></span><span></span><span></span></div><div class="title">RAPOO v3.8 SMALL - بدون أرقام و F</div><div class="header-actions"><button class="icon-btn" id="floatingBtn">🪟</button><button class="icon-btn" id="clipboardBtn">📋</button><button class="icon-btn" id="micBtn">🎤</button><div class="lang-indicator" id="langIndicator">AR</div></div></div>
<div class="suggestion-bar" id="suggestionBar"><div class="suggestion" style="opacity:.6">✓ صغير 380dp • بدون F وأرقام • تراك باد شغال</div></div>
<div class="clipboard-bar" id="clipboardBar"></div>
<div class="keyboard" id="keyboard"></div>
<div class="footer" id="footer"><div class="footer-left"><span class="battery" id="batteryDisplay">🔋 73%</span><span class="time" id="timeDisplay">12:41</span></div><div class="footer-right"><span class="messages" id="messagesDisplay">💬 3</span><span id="versionText" style="font-size:7px;opacity:.6">v3.8 SMALL</span></div></div>
<div class="overlay" id="overlay"><div style="color:#c4b5fd;text-align:center;padding:20px">TRACKPAD شغال ✓<br><small style="font-size:10px">اسحب يمين وشمال</small></div></div>
<div class="numpad-overlay" id="numpadOverlay"><div class="numpad-header"><span>🔢 نمباد شغال ✓</span><button class="close-settings" id="closeNumpad">✕</button></div><div class="numpad-grid" id="numpadGrid"></div></div>
<div class="mini-toast" id="miniToast"></div>
<div class="settings-panel" id="settingsPanel"><div class="settings-header"><span class="settings-title">⚙️ v3.8 - صغير ومتناسق</span><button class="close-settings" id="closeSettings">✕</button></div>
<div class="settings-content">
<div class="setting-group"><span class="setting-label">🌐 اللغات</span><div class="setting-grid triple" id="langOptions"><button class="option-btn" data-lang="en">EN</button><button class="option-btn" data-lang="ar">AR</button><button class="option-btn" data-lang="ar_full">AR كامل</button></div></div>
<div class="setting-group"><span class="setting-label">🔍 حجم صغير Gboard</span><div class="setting-grid" id="scaleOptions"><button class="option-btn" data-scale="small">S 40px صغير</button><button class="option-btn" data-scale="medium">M 46px Gboard</button><button class="option-btn" data-scale="large">L 52px</button><button class="option-btn" data-scale="xlarge">XL 58px</button></div><div style="font-size:9px;color:#10b981;margin-top:5px">✓ 380dp + 4 صفوف بس + بدون F وأرقام + تراك باد شغال</div></div>
<div class="setting-group"><span class="setting-label">🎤 مايك + 📋 حافظة + 🔢 نمباد + 🪟 عائم</span><div class="setting-row"><button class="option-btn" id="micToggle">🎤 مايك</button><button class="option-btn" id="clipboardToggle">📋 حافظة</button><button class="option-btn" id="numpadToggle">🔢 نمباد</button><button class="option-btn" id="floatingToggle">🪟 عائم</button></div></div>
<div class="setting-group"><div class="setting-row"><button class="option-btn" id="vibToggle">📳 اهتزاز</button><button class="option-btn" id="resetBtn">🔄 ضبط</button></div></div>
</div>
</div>
</div>
<script src="app.js"></script>
</body></html>
